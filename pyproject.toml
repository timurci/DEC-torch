[project]
name = "dec-torch"
version = "1.0.0"
description = "Deep Embedded Clustering in PyTorch"
authors = [
	{ name = "Timur Çakmakoğlu", email = "timurcakmakoglu@gmail.com" }
]
license = "MIT"
license-file = ["LICEN[CS]E*"]
requires-python = ">=3.11"
dependencies = [
	"torch>=2.9.0",
	"pandas>=2.3.0",
	"scikit-learn>=1.8.0",  # needed for k-means initialization
	"seaborn>=0.13",
	"numba>=0.63",  # umap-learn dependency to solve mysterious compatibility errors
	"umap-learn>=0.5",  # used for 2D visualization of embeddings
]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "ruff>=0.14.11",
    "ty>=0.0.11",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812"]

[tool.ruff.lint.pydocstyle]
convention = "google"
